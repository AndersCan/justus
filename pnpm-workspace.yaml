packages:
  - apps/*
  - packages/*

# The ekrooh bare toolchain (bare-link/bare-pack) cannot traverse pnpm's
# isolated (symlinked) node_modules — it needs a flat npm-style layout.
nodeLinker: hoisted

allowBuilds:
  esbuild: true

catalog:
  "@mantaq/core": ^0.5.0
  "@mantaq/inspect": ^0.2.0
  "@mantaq/sugar": ^2.0.0
  "@mantaq/viz": ^0.2.0
  "@mantaq/utils": ^0.0.4
  "@playwright/test": ^1.62.1
  "@types/node": ^24
  hyperdht: 6.33.1
  qrcode-generator: 2.0.4
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
  vitest: ^4.1.10

catalogMode: prefer
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# pnpm 11 hoisted linker: ensure workspace packages are symlinked at root.
linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - "@ekrooh/bare@0.6.1"
  - "@mantaq/core@0.5.0 || 0.5.1"
  - "@mantaq/sugar@2.0.0"
  - "@mantaq/inspect@0.2.0"
  - "@mantaq/traversal@0.3.1"
  - "@mantaq/viz@0.2.0"
  - "@mantaq/utils@0.0.4"
