packages:
  - apps/*
  - packages/*

# The ekrooh bare toolchain (bare-link/bare-pack) cannot traverse pnpm's
# isolated (symlinked) node_modules — it needs a flat npm-style layout.
nodeLinker: hoisted

allowBuilds:
  esbuild: true

catalog:
  "@mantaq/core": ^0.6.0
  "@mantaq/inspect": ^0.6.1
  "@mantaq/lit": ^0.1.0
  "@mantaq/sugar": ^2.0.5
  "@mantaq/viz": ^0.6.0
  "@mantaq/utils": ^0.0.5
  astro: ^7.4.4
  "@playwright/test": ^1.62.1
  "@types/node": ^24
  happy-dom: ^21.0.4
  hyperdht: 6.33.1
  qrcode-generator: 2.0.4
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
  vitest: ^4.1.10
  "@astrojs/starlight": ^0.42.9
  "@astrojs/mdx": ^8.1.3

catalogMode: prefer
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# pnpm 11 hoisted linker: ensure workspace packages are symlinked at root.
linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - "@ekrooh/bare@0.6.1"
  - "@mantaq/core@0.5.0 || 0.5.1 || 0.5.3 || 0.5.4 || 0.6.0"
  - "@mantaq/sugar@2.0.0 || 2.0.3 || 2.0.4 || 2.0.5"
  - "@mantaq/inspect@0.2.0 || 0.2.3 || 0.3.0 || 0.4.0 || 0.5.0 || 0.5.1 || 0.5.2 || 0.6.0 || 0.6.1"
  - "@mantaq/traversal@0.3.1 || 0.3.3 || 0.3.4 || 0.3.5"
  - "@mantaq/viz@0.2.0 || 0.2.3 || 0.3.0 || 0.4.0 || 0.5.0 || 0.6.0"
  - "@mantaq/utils@0.0.4 || 0.0.5"
  - "@mantaq/lit@0.1.0"
  - "@mantaq/pbt@0.0.4"
