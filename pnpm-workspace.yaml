packages:
  - apps/*
  - packages/*

# The ekrooh bare toolchain (bare-link/bare-pack) cannot traverse pnpm's
# isolated (symlinked) node_modules — it needs a flat npm-style layout.
nodeLinker: hoisted

allowBuilds:
  esbuild: true

catalog:
  "@mantaq/core": ^0.7.1
  "@mantaq/inspect": ^0.35.0
  "@mantaq/lit": ^0.2.1
  "@mantaq/sugar": ^2.1.1
  "@mantaq/utils": ^0.0.6
  "@varlock/bumpy": ^1.18.1
  astro: ^7.4.4
  "@playwright/test": ^1.62.1
  playwright: ^1.62.1
  "@types/node": ^24
  happy-dom: ^21.0.4
  hyperdht: 6.33.1
  qrcode-generator: 2.0.4
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.8
  vitest: ^4.1.10
  "@astrojs/starlight": ^0.42.9
  "@astrojs/mdx": ^8.1.3
  "@awesome.me/webawesome": ^3.14.0
  oxc-parser: 0.131.0

catalogMode: prefer
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# pnpm 11 hoisted linker: ensure workspace packages are symlinked at root.
linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - "@ekrooh/bare@0.7.0"
  - "@mantaq/core@0.5.0 || 0.5.1 || 0.5.3 || 0.5.4 || 0.6.0 || 0.6.1 || 0.7.0 || 0.7.1"
  - "@mantaq/sugar@2.0.0 || 2.0.3 || 2.0.4 || 2.0.5 || 2.0.6 || 2.0.7 || 2.1.0 || 2.1.1"
  - "@mantaq/inspect@0.2.0 || 0.2.3 || 0.3.0 || 0.4.0 || 0.5.0 || 0.5.1 || 0.5.2 || 0.6.0 || 0.6.1 || 0.8.0 || 0.9.0 || 0.10.1 || 0.11.0 || 0.11.1 || 0.12.0 || 0.12.1 || 0.13.0 || 0.14.0 || 0.15.0 || 0.16.0 || 0.17.0 || 0.18.0 || 0.19.0 || 0.21.0 || 0.22.0 || 0.23.0 || 0.24.0 || 0.25.0 || 0.26.0 || 0.26.1 || 0.28.0 || 0.31.0 || 0.33.0 || 0.35.0"
  - "@mantaq/traversal@0.3.1 || 0.3.3 || 0.3.4 || 0.3.5 || 0.3.6 || 0.3.7 || 0.3.8"
  - "@mantaq/viz@0.2.0 || 0.2.3 || 0.3.0 || 0.4.0 || 0.5.0 || 0.6.0 || 0.8.0 || 0.9.0 || 0.10.0 || 0.11.0 || 0.12.0 || 0.13.0 || 0.14.0 || 0.15.0 || 0.16.0 || 0.17.0 || 0.19.0 || 0.20.0 || 0.20.1 || 0.21.0 || 0.22.0 || 0.24.0 || 0.25.0"
  - "@mantaq/utils@0.0.4 || 0.0.5 || 0.0.6"
  - "@mantaq/lit@0.1.0 || 0.1.1 || 0.2.0 || 0.2.1"
  - "@mantaq/pbt@0.0.4 || 0.0.5"
