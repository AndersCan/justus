<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1730" media="(prefers-color-scheme: dark)" />
    <style>
      /* Design tokens (space-separated RGB, consumed by uno.config.ts). Brand
         palette: indigo #4B3FD6, coral #FF8A5B (wordmark dot only). The dark
         block is repeated for the system preference and the in-app override. */
      :root {
        --canvas: 246 245 250;
        --surface: 255 255 255;
        --subtle: 238 237 244;
        --line: 227 225 238;
        --fg: 20 18 31;
        --muted: 91 88 112;
        --accent: 75 63 214;
        --accent-strong: 51 40 168;
        --accent-soft: 233 231 251;
        --on-fill: 255 255 255;
        --brand: 255 138 91;
        --danger: 229 72 77;
        --danger-fg: 198 47 53;
        --ok: 14 143 130;
        --ok-fg: 11 122 111;
        --warn: 245 166 35;
        --warn-fg: 154 91 0;
        --trust-green: 14 143 130;
        --trust-amber: 245 166 35;
        --trust-red: 229 72 77;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --canvas: 15 13 26;
          --surface: 26 23 48;
          --subtle: 37 33 61;
          --line: 51 46 82;
          --fg: 242 240 250;
          --muted: 160 156 184;
          --accent: 139 124 246;
          --accent-strong: 164 152 248;
          --accent-soft: 36 31 72;
          --on-fill: 15 13 26;
          --brand: 255 138 91;
          --danger: 255 107 114;
          --danger-fg: 255 107 114;
          --ok: 46 196 178;
          --ok-fg: 46 196 178;
          --warn: 245 166 35;
          --warn-fg: 245 166 35;
          --trust-green: 46 196 178;
          --trust-amber: 245 166 35;
          --trust-red: 255 107 114;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --canvas: 15 13 26;
        --surface: 26 23 48;
        --subtle: 37 33 61;
        --line: 51 46 82;
        --fg: 242 240 250;
        --muted: 160 156 184;
        --accent: 139 124 246;
        --accent-strong: 164 152 248;
        --accent-soft: 36 31 72;
        --on-fill: 15 13 26;
        --brand: 255 138 91;
        --danger: 255 107 114;
        --danger-fg: 255 107 114;
        --ok: 46 196 178;
        --ok-fg: 46 196 178;
        --warn: 245 166 35;
        --warn-fg: 245 166 35;
        --trust-green: 46 196 178;
        --trust-amber: 245 166 35;
        --trust-red: 255 107 114;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        color-scheme: light;
      }
      /* Minimal reset (the Uno preset ships no preflight). */
      *,
      ::before,
      ::after {
        box-sizing: border-box;
        border: 0 solid rgb(var(--line));
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
        margin: 0;
      }
      button {
        background: none;
        padding: 0;
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      h1,
      h2,
      h3,
      p,
      ul,
      ol,
      figure {
        margin: 0;
      }
      ul,
      ol {
        padding: 0;
        list-style: none;
      }
      img,
      svg {
        display: block;
      }
      html,
      body {
        margin: 0;
        background: rgb(var(--canvas));
        color: rgb(var(--fg));
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script src="./theme-boot.js"></script>
    <title>Justus</title>
  </head>
  <body>
    <div id="render-root"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
