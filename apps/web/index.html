<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)" />
    <style>
      /* Design tokens (space-separated RGB, consumed by uno.config.ts). */
      :root {
        --canvas: 246 247 249;
        --surface: 255 255 255;
        --subtle: 238 240 244;
        --line: 223 226 232;
        --fg: 24 27 34;
        --muted: 106 113 128;
        --accent: 67 97 238;
        --accent-strong: 48 76 214;
        --danger: 220 53 69;
        --ok: 34 150 94;
        --warn: 214 140 20;
        --trust-green: 34 150 94;
        --trust-amber: 214 140 20;
        --trust-red: 220 53 69;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: 11 12 15;
          --surface: 22 24 29;
          --subtle: 34 37 44;
          --line: 48 52 61;
          --fg: 236 238 242;
          --muted: 141 148 163;
          --accent: 122 146 255;
          --accent-strong: 148 168 255;
          --danger: 255 107 120;
          --ok: 72 199 142;
          --warn: 242 178 70;
          --trust-green: 72 199 142;
          --trust-amber: 242 178 70;
          --trust-red: 255 107 120;
          color-scheme: dark;
        }
      }
      /* Minimal reset (the Uno preset ships no preflight). */
      *,
      ::before,
      ::after {
        box-sizing: border-box;
        border: 0 solid rgb(var(--line));
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
        margin: 0;
      }
      button {
        background: none;
        padding: 0;
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      h1,
      h2,
      h3,
      p,
      ul,
      ol,
      figure {
        margin: 0;
      }
      ul,
      ol {
        padding: 0;
        list-style: none;
      }
      img,
      svg {
        display: block;
      }
      html,
      body {
        margin: 0;
        background: rgb(var(--canvas));
        color: rgb(var(--fg));
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234361ee'/%3E%3Ccircle cx='36' cy='38' r='9' fill='white'/%3E%3Cpath d='M14 78 40 50 56 66 68 54 86 78Z' fill='white'/%3E%3C/svg%3E"
    />
    <title>Justus</title>
  </head>
  <body>
    <div id="render-root"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
