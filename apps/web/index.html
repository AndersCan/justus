<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="./src/design/justus/tokens/theme.css" />
    <link rel="stylesheet" href="./src/tokens.css" />
    <style>
      /* Minimal reset (the Uno preset ships no preflight). */
      *,
      ::before,
      ::after {
        box-sizing: border-box;
        border: 0 solid rgb(var(--line));
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
        margin: 0;
      }
      button {
        background: none;
        padding: 0;
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      h1,
      h2,
      h3,
      p,
      ul,
      ol,
      figure {
        margin: 0;
      }
      ul,
      ol {
        padding: 0;
        list-style: none;
      }
      img,
      svg {
        display: block;
      }
      html,
      body {
        margin: 0;
        background: rgb(var(--canvas));
        color: rgb(var(--fg));
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/theme-boot.js"></script>
    <title>Justus</title>
  </head>
  <body>
    <div id="render-root"></div>
    <script type="module" src="./src/web-awesome.ts"></script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
