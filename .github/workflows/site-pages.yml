name: site-pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_run:
    workflows: [release-android]
    types: [completed]

concurrency:
  group: site-pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.22.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.4"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm site:build
        env:
          SITE_BASE: ${{ github.event_name == 'pull_request' && format('/justus/pr/{0}', github.event.pull_request.number) || '/justus' }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check flows docs
        run: node scripts/check-flows-site.mjs site-dist

      - name: Check the built site
        run: pnpm exec mantaq-check-site site-dist --base "$SITE_BASE" --links docs/design/sharing-flows.md --site https://anderscan.github.io/justus/
        env:
          SITE_BASE: ${{ github.event_name == 'pull_request' && format('/justus/pr/{0}', github.event.pull_request.number) || '/justus' }}

      # Deploys happen in site-deploy.yml, which publishes main plus every open
      # pull request's preview from these artifacts.
      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site-dist
          retention-days: ${{ github.event_name == 'pull_request' && 14 || 90 }}
