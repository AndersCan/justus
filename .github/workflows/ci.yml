name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # pnpm 11.22.0 matches pnpm-lock.yaml; node 22.18 is the project minimum.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.22.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint, and format check
        run: pnpm exec vp check

      - name: Run test suites
        run: pnpm exec vp run -r test

  e2e:
    name: e2e (Playwright, real worklet)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.22.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
          cache: pnpm
      # The bare runtime links libatomic on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libatomic1
      - run: pnpm install --frozen-lockfile
      # --with-deps installs the apt libraries Chromium needs.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      # scripts/e2e-server.mjs builds web + backend, then boots the worklet
      # serving the built app same-origin on :8090, as on device.
      - name: Run Playwright tests
        run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  bare:
    name: p2p flows inside the Bare runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.22.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
          cache: pnpm
      # The bare runtime links libatomic on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libatomic1
      - run: pnpm install --frozen-lockfile
      # The same scenarios as the Node suite (apps/backend/test/p2p-scenarios.ts),
      # run under Bare with bare-fs/bare-path/bare-crypto and a local testnet:
      # catches "works in Node, breaks in Bare" (#200).
      - name: Run p2p scenarios under Bare
        run: pnpm test:bare

  e2e-multi-peer:
    name: e2e (multi-peer hub and p2p)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.22.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
          cache: pnpm
      # The bare runtime links libatomic on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libatomic1
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Hub harness tests
        run: pnpm test:e2e-hub
      - name: Playwright across real worklets
        run: pnpm test:e2e-p2p
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: playwright-p2p-traces
          path: test-results/
          retention-days: 14

  desktop-macos:
    name: desktop (macOS app smoke)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.22.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
          cache: pnpm
      # Build-time only; the app needs no runtime. Pinned: std.Io and
      # std.process still change between Zig releases.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - run: pnpm install --frozen-lockfile
      - name: Host unit tests
        run: zig build test
        working-directory: apps/desktop
      - name: Build Justus.app
        run: node apps/desktop/scripts/build.mjs
      - name: Two instances launch, the webview redeems each nonce, no orphans
        run: node apps/desktop/scripts/smoke.mjs

  desktop-linux:
    name: desktop (Linux tarball smoke)
    # Oldest supported glibc: binaries built here run on newer distros.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.22.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
          cache: pnpm
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Install GTK, WebKitGTK, Xvfb and lsof
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb lsof libatomic1
      - run: pnpm install --frozen-lockfile
      - name: Host unit tests
        run: xvfb-run -a zig build test
        working-directory: apps/desktop
      - name: Build the Linux tarball
        run: node apps/desktop/scripts/build.mjs
      - name: Two instances launch, the webview redeems each nonce, no orphans
        run: xvfb-run -a node apps/desktop/scripts/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: justus-linux-tarball
          path: apps/desktop/dist/justus-linux-*.tar.gz*

  android:
    name: android (assembleDebug)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.22.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      # Validates the Gradle wrapper jar and caches Gradle state.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android SDK platform + NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
      - run: pnpm install --frozen-lockfile
      # Runs link (bare-link), buildBareJs, buildWebAssets and packApp, then
      # compiles the Kotlin, resources and manifest.
      - name: Build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
        working-directory: apps/android
