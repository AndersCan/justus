name: release-android

# Builds the signed Play bundle with fastlane and uploads it to the internal
# track. Runbook: docs/release-android.md
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName shown in Play (e.g. 0.2.0)"
        required: true
      upload:
        description: "Upload to Play internal track (off for the first, manual upload)"
        type: boolean
        default: true
  push:
    tags: ["v*"]

concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: play
    defaults:
      run:
        working-directory: apps/android
    env:
      VERSION_NAME: ${{ inputs.version_name || github.ref_name }}
      # Paths only. The signing secrets are set on the fastlane steps alone, so
      # dependency install scripts and tests never see them.
      JUSTUS_UPLOAD_STORE_FILE: ${{ github.workspace }}/../upload.jks
      SUPPLY_JSON_KEY: ${{ github.workspace }}/../play-service-account.json
      # Set to "draft" (environment variable) until the app is first published.
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.22.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/android
      - name: Install Android SDK platform + NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
      - run: pnpm install --frozen-lockfile
      - name: Gate on check + unit tests
        run: pnpm exec vp check && pnpm exec vp run -r test
      # Device gate: the debug APK on an x86_64 emulator, running .maestro/flows
      # (boot + native photo picker). Runs before any signing material exists.
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        working-directory: .
        env:
          MAESTRO_VERSION: "2.8.0"
          MAESTRO_SHA256: b3e561161904fb391875ca5834d5b22cf0b01c052dd1b408ad83e30d8f8951b3
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - name: Gate on Maestro device flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/maestro-e2e.sh emulator-5554
      - name: Upload Maestro diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-out
          path: .maestro/out
          retention-days: 14
      - name: Write upload keystore and Play key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.JUSTUS_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$JUSTUS_UPLOAD_STORE_FILE"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$SUPPLY_JSON_KEY"
      - name: Build and upload to internal track
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          JUSTUS_UPLOAD_STORE_PASSWORD: ${{ secrets.JUSTUS_UPLOAD_STORE_PASSWORD }}
          JUSTUS_UPLOAD_KEY_ALIAS: ${{ secrets.JUSTUS_UPLOAD_KEY_ALIAS }}
          JUSTUS_UPLOAD_KEY_PASSWORD: ${{ secrets.JUSTUS_UPLOAD_KEY_PASSWORD }}
        run: bundle exec fastlane internal version_name:"$VERSION_NAME"
      # First release: Play's API can't see the app yet, so build only and
      # upload the artifact by hand. versionCode 1 is fine for that one.
      - name: Build only
        if: ${{ github.event_name != 'push' && !inputs.upload }}
        env:
          JUSTUS_UPLOAD_STORE_PASSWORD: ${{ secrets.JUSTUS_UPLOAD_STORE_PASSWORD }}
          JUSTUS_UPLOAD_KEY_ALIAS: ${{ secrets.JUSTUS_UPLOAD_KEY_ALIAS }}
          JUSTUS_UPLOAD_KEY_PASSWORD: ${{ secrets.JUSTUS_UPLOAD_KEY_PASSWORD }}
        run: bundle exec fastlane build version_code:1 version_name:"$VERSION_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: justus-android-aab
          path: apps/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
