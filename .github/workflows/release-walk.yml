name: release-walk

# Walks the release build of the Android app on an emulator: Ada (web, in
# Chromium) invites Ben (the release APK) and Ben joins. Run it by hand from
# Actions > release-walk > Run workflow, or call it from another workflow.
# Never on pushes or pull requests.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  walk:
    name: Release walk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.22.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK platform + NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
      - run: pnpm install --frozen-lockfile
      - name: Build the release Ben updates from
        run: bash scripts/walk-from.sh
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.8.0"
          MAESTRO_SHA256: b3e561161904fb391875ca5834d5b22cf0b01c052dd1b408ad83e30d8f8951b3
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - name: Walk (Ada in Chromium, Ben on the release APK)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          JUSTUS_VARIANT: release
          JUSTUS_WALK: "1"
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/maestro-e2e.sh emulator-5554
      - name: Upload walk results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-walk
          path: .maestro/out
          retention-days: 14
          if-no-files-found: warn
