name: ios-device

# Walks the first-run flow on an iPhone Simulator, up to the share menu, and opens the share
# menu on an iPad Simulator.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: iphone
            name: iPhone first-run
            flag: ""
          - kind: ipad
            name: iPad share sheet
            flag: --ipad
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.22.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install xcodegen
        run: command -v xcodegen || brew install xcodegen

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.12.1"
          MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      - name: Maestro walk (${{ matrix.kind }})
        timeout-minutes: 30
        run: node scripts/maestro-ios.mjs ${{ matrix.flag }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() }}
        with:
          name: ios-device-${{ matrix.kind }}
          path: .maestro/out
          retention-days: 14

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ success() && matrix.kind == 'ipad' }}
        with:
          name: ios-device-ipad-shots
          path: .maestro/out/**/ipad-share-sheet.png
          retention-days: 14
