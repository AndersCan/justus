name: android-device

# Runs the Maestro device flows on an emulator for pull requests that touch
# the Android app or the flows themselves.
on:
  pull_request:
    paths:
      - "apps/android/**"
      - ".maestro/**"
      - "scripts/maestro-e2e.sh"
      - ".github/workflows/android-device.yml"
  workflow_dispatch:

concurrency:
  group: android-device-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.22.0
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
          cache: pnpm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/android
      - name: Install Android SDK platform + NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0" "ndk;27.2.12479018"
      - run: pnpm install --frozen-lockfile
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.8.0"
          MAESTRO_SHA256: b3e561161904fb391875ca5834d5b22cf0b01c052dd1b408ad83e30d8f8951b3
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip"
          echo "$MAESTRO_SHA256  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - name: Pre-fetch Gradle and dependencies
        working-directory: apps/android
        run: |
          for i in 1 2 3 4 5; do ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease -Pjustus.deviceCheck && exit 0; sleep 10; done
          exit 1
      # The R8 release build: the same flows must pass with shrinking on.
      - name: Maestro device flows (release, R8)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          JUSTUS_VARIANT: release
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/maestro-e2e.sh emulator-5554
      - name: Maestro device flows
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/maestro-e2e.sh emulator-5554
      - name: Upload Maestro diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maestro-out
          path: .maestro/out
          retention-days: 14
      # Spike: Play listing screenshots through screengrab. Moves to release-android.yml.
      - name: Store screenshots
        if: ${{ !cancelled() }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -wipe-data
          working-directory: apps/android
          script: bundle exec fastlane screenshots serial:emulator-5554 || { adb logcat -d -s ListingShots TestRunner AndroidRuntime; exit 1; }
      - name: Upload store screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-screenshots
          path: apps/android/fastlane/metadata/android/en-US/images/phoneScreenshots/*.png
          retention-days: 14
      # Raw full-screen captures for store-listing/captures/android. Not part of the release.
      - name: Store captures
        if: ${{ !cancelled() }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_3
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -wipe-data
          working-directory: apps/android
          script: bash scripts/store-captures.sh emulator-5554
      - name: Upload store captures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-captures
          path: apps/android/store-captures/*.png
          retention-days: 14
