name: issue-refs

on:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.18"
      - name: Workaround/limitation markers name only open issues
        run: node scripts/check-issue-refs.mjs
        env:
          GH_TOKEN: ${{ github.token }}
