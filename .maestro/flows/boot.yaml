appId: io.justus.app
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
# ClearState => fresh folder => empty gallery. The empty-state heading is page-unique (the
# "Gallery" <h1> is also a persistent nav link, so it is NOT proof the gallery rendered).
- extendedWaitUntil:
    visible: "This folder is empty — for now."
    timeout: 60000
