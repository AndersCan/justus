appId: no.cankode.justus
---
# One fresh-install pass. Boot is proven by onboarding (the name and album both go through the
# worklet); the picker step proves web → worklet → host invoke → native picker.
- launchApp:
    clearState: true
# Fresh install => the intro. Inputs are one character (Maestro types slowly on Android), and taps
# cap the settle wait: each step below waits for its own next screen anyway.
- extendedWaitUntil:
    visible: "Skip"
    timeout: 60000
- tapOn:
    text: "Skip"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Your name"
    waitToSettleTimeoutMs: 500
- inputText: "M"
# Submit with Enter, not "Continue": the keyboard can cover the button.
- pressKey: Enter
- extendedWaitUntil:
    visible: "Start sharing"
    timeout: 20000
- tapOn:
    text: "Album name"
    waitToSettleTimeoutMs: 500
- inputText: "M"
- pressKey: Enter
# The first album opens itself; its add button names it and goes straight to the system picker.
- extendedWaitUntil:
    visible: "No photos in this album yet."
    timeout: 20000
- tapOn:
    text: "Add photos to M"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
# The picker is a NATIVE surface whose labels differ by picker version (the Play-updated one has
# a "Collections" tab, the google_apis CI image's does not), and its "Photos" title is also our
# heading. So prove it by our album page being covered, then back again once it closes.
- extendedWaitUntil:
    notVisible: "No photos in this album yet."
    timeout: 15000
- back
- extendedWaitUntil:
    visible: "No photos in this album yet."
    timeout: 15000
# App lock: the phone has PIN 1111 (set by scripts/maestro-e2e.sh). Turning the lock on asks for it.
- tapOn:
    text: "Settings"
    waitToSettleTimeoutMs: 500
# The lock card arrives after the status call; the WebView's accessibility tree can miss a node
# added late, so leave and re-enter Settings and read the card from a fresh render.
- tapOn:
    text: "Help"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Settings"
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: "Require unlock to open Justus.*"
    timeout: 20000
- tapOn:
    text: "Require unlock to open Justus.*"
    waitToSettleTimeoutMs: 500
- inputText: "1111"
- pressKey: Enter
- extendedWaitUntil:
    visible: "App lock is on"
    timeout: 15000
# Away under 30s: back in, no lock.
- pressKey: Home
- launchApp:
    stopApp: false
- scrollUntilVisible:
    element: "Require unlock to open Justus.*"
    timeout: 15000
- assertNotVisible: "Justus is locked"
# Away over 30s: the lock shows and the app underneath is unreachable.
- pressKey: Home
- extendedWaitUntil:
    visible: "Justus is locked"
    timeout: 31000
    optional: true
- launchApp:
    stopApp: false
# The system PIN prompt (secure, unreadable) opens over the lock screen; the app behind it is hidden.
- assertNotVisible: "Require unlock to open Justus.*"
- pressKey: Back
- launchApp:
    stopApp: false
- assertVisible: "Justus is locked"
- assertNotVisible: "Require unlock to open Justus.*"
- tapOn:
    text: "Unlock"
    waitToSettleTimeoutMs: 500
- inputText: "1111"
- pressKey: Enter
- scrollUntilVisible:
    element: "Require unlock to open Justus.*"
    timeout: 15000
# A fresh launch always asks: the system PIN prompt opens over the lock screen at once. Let it
# open, close it, and unlock from the lock screen the same way as above.
- launchApp
- waitForAnimationToEnd:
    timeout: 4000
# Back only when the prompt is up (the lock text is unreadable then); on the bare lock screen it would leave the app.
- runFlow:
    when:
      notVisible: "Justus is locked"
    commands:
      - pressKey: Back
- extendedWaitUntil:
    visible: "Justus is locked"
    timeout: 15000
- assertNotVisible: "Require unlock to open Justus.*"
- tapOn:
    text: "Unlock"
    waitToSettleTimeoutMs: 500
- inputText: "1111"
- pressKey: Enter
- extendedWaitUntil:
    visible: "Settings"
    timeout: 30000
# Turn it off (asks again). A fresh launch has the same late lock card, so re-enter Settings first.
- tapOn:
    text: "Settings"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Help"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Settings"
    waitToSettleTimeoutMs: 500
- scrollUntilVisible:
    element: "Require unlock to open Justus.*"
    timeout: 20000
- tapOn:
    text: "Require unlock to open Justus.*"
    waitToSettleTimeoutMs: 500
- inputText: "1111"
- pressKey: Enter
- extendedWaitUntil:
    visible: "App lock is off"
    timeout: 15000
