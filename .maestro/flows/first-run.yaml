appId: no.cankode.justus
---
# One fresh-install pass. Boot is proven by onboarding (the name and album both go through the
# worklet); the picker step proves web → worklet → host invoke → native picker.
- launchApp:
    clearState: true
# Fresh install => the intro. Inputs are one character (Maestro types slowly on Android), and taps
# cap the settle wait: each step below waits for its own next screen anyway.
- extendedWaitUntil:
    visible: "Skip"
    timeout: 90000
- assertVisible: "Photos go straight to your friends"
- tapOn:
    text: "Skip"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
# Back from the name step returns to the card left, not the last card.
- tapOn:
    text: "Back"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Photos go straight to your friends"
    timeout: 10000
- tapOn:
    text: "Skip"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Your name"
    waitToSettleTimeoutMs: 500
- inputText: "M"
# Submit with Enter, not "Continue": the keyboard can cover the button.
- pressKey: Enter
# The phone has PIN 1111 (set by scripts/maestro-e2e.sh): the first-run card turns App lock on.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Lock Justus?"
          timeout: 20000
      - tapOn:
          text: "Enable"
          waitToSettleTimeoutMs: 500
      - inputText: "1111"
      - pressKey: Enter
      - extendedWaitUntil:
          visible: "App lock is on"
          timeout: 15000
# iOS: the Simulator has a Face ID enrolled, so the lock card shows; the walk declines it. The
# Simulator's Face ID prompt opens too late on a cold runner (-1000 "UI activation timed out"), so
# the walk does not turn App lock on.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Lock Justus?"
          timeout: 20000
      - tapOn:
          text: "Not now"
          waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          notVisible: "Lock Justus?"
          timeout: 8000
- extendedWaitUntil:
    visible: "Start sharing"
    timeout: 20000
- tapOn:
    text: "Album name"
    waitToSettleTimeoutMs: 500
- inputText: "M"
- pressKey: Enter
# The first album opens itself; its add button names it and goes straight to the system picker.
- extendedWaitUntil:
    visible: "No photos in this album yet."
    timeout: 20000
# The photo picker is opened on Android only.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Add photos to M"
          retryTapIfNoChange: false
          waitToSettleTimeoutMs: 500
      # The picker is a NATIVE surface whose labels differ by picker version (the Play-updated one has
      # a "Collections" tab, the google_apis CI image's does not), and its "Photos" title is also our
      # heading. So prove it by our album page being covered, then back again once it closes.
      - extendedWaitUntil:
          notVisible: "No photos in this album yet."
          timeout: 15000
      - back
      - extendedWaitUntil:
          visible: "No photos in this album yet."
          timeout: 15000
# Send invite link opens the system share sheet; Back closes it and leaves the page as it was.
- tapOn:
    text: "Invite & members"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Invite people"
    timeout: 15000
- tapOn:
    text: "Send invite link"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
# Android: the share sheet covers our page; Back closes it.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          notVisible: "Invite people"
          timeout: 15000
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      # The sheet's own backdrop ("dismiss popup") is there as soon as the sheet is: on CI the iPhone sheet
      # can stay blank (no Copy action ever drawn), so Copy is not the signal that the sheet is up.
      # The backdrop label is not always found though the sheet is drawn: Copy also counts as the sheet.
      - retry:
          maxRetries: 3
          commands:
            - runFlow:
                when:
                  notVisible: "Copy"
                commands:
                  - extendedWaitUntil:
                      visible: "dismiss popup"
                      timeout: 5000
      - takeScreenshot: .maestro/out/ios-share-sheet
      # Copy closes the sheet on its own; a blank sheet is closed by its backdrop.
      - runFlow:
          when:
            visible: "Copy"
          commands:
            - tapOn:
                text: "Copy"
      - runFlow:
          when:
            visible: "dismiss popup"
          commands:
            # The backdrop element spans the screen, so tapping it by text hits its centre, on the sheet.
            # Tap above the sheet (its top edge is about 300 pt of 874).
            - tapOn:
                point: "50%,15%"
- extendedWaitUntil:
    visible: "Send invite link"
    timeout: 15000
# The lock section, Android only: the iOS walk declines App lock above.
- runFlow:
    when:
      platform: Android
    commands:
      # App lock was turned on from the first-run card; Settings shows it on.
      - tapOn:
          text: "Settings"
          waitToSettleTimeoutMs: 500
      # The lock card arrives after the status call; the WebView's accessibility tree can miss a node
      # added late, so leave and re-enter Settings and read the card from a fresh render.
      - tapOn:
          text: "Photos"
          waitToSettleTimeoutMs: 500
      - tapOn:
          text: "Settings"
          waitToSettleTimeoutMs: 500
      - scrollUntilVisible:
          element: "Require unlock to open Justus.*"
          timeout: 20000
      # Away under 30s: back in, no lock.
      - runFlow:
          when:
            platform: Android
          commands:
            - pressKey: Home
            - launchApp:
                stopApp: false
      - scrollUntilVisible:
          element: "Require unlock to open Justus.*"
          timeout: 15000
      - assertNotVisible: "Justus is locked"
      # Away over 30s: the lock shows and the app underneath is unreachable.
      - runFlow:
          when:
            platform: Android
          commands:
            - pressKey: Home
      - runFlow:
          when:
            platform: Android
          commands:
            - extendedWaitUntil:
                visible: "Justus is locked"
                timeout: 31000
                optional: true
      - runFlow:
          when:
            platform: Android
          commands:
            - launchApp:
                stopApp: false
      # The system PIN prompt (secure, unreadable) opens over the lock screen on Android; the app behind it is hidden.
      - runFlow:
          when:
            platform: Android
          commands:
            - assertNotVisible: "Require unlock to open Justus.*"
            - pressKey: Back
            - launchApp:
                stopApp: false
            - assertVisible: "Justus is locked"
            - assertNotVisible: "Require unlock to open Justus.*"
            - tapOn:
                text: "Unlock"
                waitToSettleTimeoutMs: 500
            - inputText: "1111"
            - pressKey: Enter
      - scrollUntilVisible:
          element: "Require unlock to open Justus.*"
          timeout: 15000
      # A fresh launch always asks: the system PIN prompt opens over the lock screen at once. Let it
      # open, close it, and unlock from the lock screen the same way as above.
      - launchApp
      - waitForAnimationToEnd:
          timeout: 4000
      # Back only when the prompt is up (the lock text is unreadable then); on the bare lock screen it would leave the app.
      - runFlow:
          when:
            platform: Android
            notVisible: "Justus is locked"
          commands:
            - pressKey: Back
      - runFlow:
          when:
            platform: Android
          commands:
            - extendedWaitUntil:
                visible: "Justus is locked"
                timeout: 15000
            - assertNotVisible: "Require unlock to open Justus.*"
            - tapOn:
                text: "Unlock"
                waitToSettleTimeoutMs: 500
            - inputText: "1111"
            - pressKey: Enter
      - extendedWaitUntil:
          visible: "Settings"
          timeout: 30000
      # Turn it off (asks again). A fresh launch has the same late lock card, so re-enter Settings first.
      - tapOn:
          text: "Settings"
          waitToSettleTimeoutMs: 500
      - tapOn:
          text: "Photos"
          waitToSettleTimeoutMs: 500
      - tapOn:
          text: "Settings"
          waitToSettleTimeoutMs: 500
      - scrollUntilVisible:
          element: "Require unlock to open Justus.*"
          timeout: 20000
      - tapOn:
          text: "Require unlock to open Justus.*"
          waitToSettleTimeoutMs: 500
      - runFlow:
          when:
            platform: Android
          commands:
            - inputText: "1111"
            - pressKey: Enter
            - extendedWaitUntil:
                visible: "App lock is off"
                timeout: 15000
