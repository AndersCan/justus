appId: no.cankode.justus
---
# One fresh-install pass. Boot is proven by onboarding (the name and album both go through the
# worklet); the picker step proves web → worklet → host invoke → native picker.
- launchApp:
    clearState: true
# Fresh install => the intro. Inputs are one character (Maestro types slowly on Android), and taps
# cap the settle wait: each step below waits for its own next screen anyway.
- extendedWaitUntil:
    visible: "Skip"
    timeout: 90000
- assertVisible: "Photos go straight to your friends"
- tapOn:
    text: "Skip"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
# Back from the name step returns to the card left, not the last card.
- tapOn:
    text: "Back"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Photos go straight to your friends"
    timeout: 10000
- tapOn:
    text: "Skip"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Your name"
    waitToSettleTimeoutMs: 500
- inputText: "M"
# Submit with Enter, not "Continue": the keyboard can cover the button.
- pressKey: Enter
# The phone has PIN 1111 (set by scripts/maestro-e2e.sh): the first-run card turns App lock on.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: "Lock Justus?"
          timeout: 20000
      - tapOn:
          text: "Enable"
          waitToSettleTimeoutMs: 500
      - inputText: "1111"
      - pressKey: Enter
      - extendedWaitUntil:
          visible: "App lock is on"
          timeout: 15000
# iOS: the Simulator has a Face ID enrolled by scripts/maestro-ios.mjs, which serves FACE.
# A match posted before the Face ID prompt is up is dropped, so retry it.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Lock Justus?"
          timeout: 20000
      - tapOn:
          text: "Enable"
          waitToSettleTimeoutMs: 500
      # A tap on Enable can be dropped while the page settles: tap again when the card is still up.
      - retry:
          maxRetries: 3
          commands:
            - runFlow:
                when:
                  visible: "Lock Justus?"
                commands:
                  - tapOn:
                      text: "Enable"
                      waitToSettleTimeoutMs: 500
            - runScript: ../scripts/face-match.js
            - extendedWaitUntil:
                visible: "App lock is on"
                timeout: 8000
- extendedWaitUntil:
    visible: "Start sharing"
    timeout: 20000
- tapOn:
    text: "Album name"
    waitToSettleTimeoutMs: 500
- inputText: "M"
- pressKey: Enter
# The first album opens itself; its add button names it and goes straight to the system picker.
- extendedWaitUntil:
    visible: "No photos in this album yet."
    timeout: 20000
# The photo picker is opened on Android only.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Add photos to M"
          retryTapIfNoChange: false
          waitToSettleTimeoutMs: 500
      # The picker is a NATIVE surface whose labels differ by picker version (the Play-updated one has
      # a "Collections" tab, the google_apis CI image's does not), and its "Photos" title is also our
      # heading. So prove it by our album page being covered, then back again once it closes.
      - extendedWaitUntil:
          notVisible: "No photos in this album yet."
          timeout: 15000
      - back
      - extendedWaitUntil:
          visible: "No photos in this album yet."
          timeout: 15000
# Send invite link opens the system share sheet; Back closes it and leaves the page as it was.
- tapOn:
    text: "Invite & members"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Invite people"
    timeout: 15000
- tapOn:
    text: "Send invite link"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
# Android: the share sheet covers our page; Back closes it.
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          notVisible: "Invite people"
          timeout: 15000
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      # The share sheet is a popover over a still-visible page on iPad, so detect its own Copy action
      # (full match: "Copy invite link" does not match), then dismiss it.
      - extendedWaitUntil:
          visible: "Copy"
          timeout: 15000
      - takeScreenshot: .maestro/out/ios-share-sheet
      # The iPhone sheet has no "Close" text and a tap on the page above it did not dismiss it:
      # Copy is an action that closes the sheet on its own.
      - tapOn:
          text: "Copy"
- extendedWaitUntil:
    visible: "Send invite link"
    timeout: 15000
# The lock section. Android answers the system PIN prompt; iOS answers Face ID with a match.
- runFlow:
    commands:
      # App lock was turned on from the first-run card; Settings shows it on.
      - tapOn:
          text: "Settings"
          waitToSettleTimeoutMs: 500
      # The lock card arrives after the status call; the WebView's accessibility tree can miss a node
      # added late, so leave and re-enter Settings and read the card from a fresh render.
      - tapOn:
          text: "Photos"
          waitToSettleTimeoutMs: 500
      - tapOn:
          text: "Settings"
          waitToSettleTimeoutMs: 500
      - scrollUntilVisible:
          element: "Require unlock to open Justus.*"
          timeout: 20000
      # Away under 30s: back in, no lock.
      - pressKey: Home
      - runFlow:
          when:
            platform: Android
          commands:
            - launchApp:
                stopApp: false
      # iOS: launchApp does not bring a backgrounded Justus back, so tap its home screen icon.
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: "Justus"
                waitToSettleTimeoutMs: 500
      - scrollUntilVisible:
          element: "Require unlock to open Justus.*"
          timeout: 15000
      - assertNotVisible: "Justus is locked"
      # Away over 30s: the lock shows and the app underneath is unreachable.
      - pressKey: Home
      - extendedWaitUntil:
          visible: "Justus is locked"
          timeout: 31000
          optional: true
      - runFlow:
          when:
            platform: Android
          commands:
            - launchApp:
                stopApp: false
      # iOS: launchApp does not bring a backgrounded Justus back, so tap its home screen icon.
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: "Justus"
                waitToSettleTimeoutMs: 500
      # The system PIN prompt (secure, unreadable) opens over the lock screen on Android; the app behind it is hidden.
      - runFlow:
          when:
            platform: Android
          commands:
            - assertNotVisible: "Require unlock to open Justus.*"
            - pressKey: Back
            - launchApp:
                stopApp: false
            - assertVisible: "Justus is locked"
            - assertNotVisible: "Require unlock to open Justus.*"
            - tapOn:
                text: "Unlock"
                waitToSettleTimeoutMs: 500
            - inputText: "1111"
            - pressKey: Enter
      - runFlow:
          when:
            platform: iOS
          commands:
            # The Face ID prompt opens over the lock screen and hides the app's text, like the PIN prompt.
            - extendedWaitUntil:
                visible: "Face ID"
                timeout: 15000
            - assertNotVisible: "Require unlock to open Justus.*"
            - retry:
                maxRetries: 3
                commands:
                  - runScript: ../scripts/face-match.js
                  - extendedWaitUntil:
                      notVisible: "Face ID"
                      timeout: 8000
      - scrollUntilVisible:
          element: "Require unlock to open Justus.*"
          timeout: 15000
      # A fresh launch always asks: the system PIN prompt opens over the lock screen at once. Let it
      # open, close it, and unlock from the lock screen the same way as above.
      - launchApp
      - waitForAnimationToEnd:
          timeout: 4000
      # Back only when the prompt is up (the lock text is unreadable then); on the bare lock screen it would leave the app.
      - runFlow:
          when:
            platform: Android
            notVisible: "Justus is locked"
          commands:
            - pressKey: Back
      - runFlow:
          when:
            platform: Android
          commands:
            - extendedWaitUntil:
                visible: "Justus is locked"
                timeout: 15000
            - assertNotVisible: "Require unlock to open Justus.*"
            - tapOn:
                text: "Unlock"
                waitToSettleTimeoutMs: 500
            - inputText: "1111"
            - pressKey: Enter
      - runFlow:
          when:
            platform: iOS
          commands:
            # A fresh launch asks at once; the Face ID prompt hides the app's text.
            - extendedWaitUntil:
                visible: "Face ID"
                timeout: 15000
            - assertNotVisible: "Require unlock to open Justus.*"
            - retry:
                maxRetries: 3
                commands:
                  - runScript: ../scripts/face-match.js
                  - extendedWaitUntil:
                      notVisible: "Face ID"
                      timeout: 8000
      - extendedWaitUntil:
          visible: "Settings"
          timeout: 30000
      # Turn it off (asks again). A fresh launch has the same late lock card, so re-enter Settings first.
      - tapOn:
          text: "Settings"
          waitToSettleTimeoutMs: 500
      - tapOn:
          text: "Photos"
          waitToSettleTimeoutMs: 500
      - tapOn:
          text: "Settings"
          waitToSettleTimeoutMs: 500
      - scrollUntilVisible:
          element: "Require unlock to open Justus.*"
          timeout: 20000
      - tapOn:
          text: "Require unlock to open Justus.*"
          waitToSettleTimeoutMs: 500
      - runFlow:
          when:
            platform: Android
          commands:
            - inputText: "1111"
            - pressKey: Enter
            - extendedWaitUntil:
                visible: "App lock is off"
                timeout: 15000
      - runFlow:
          when:
            platform: iOS
          commands:
            - retry:
                maxRetries: 3
                commands:
                  - runScript: ../scripts/face-match.js
                  - extendedWaitUntil:
                      visible: "App lock is off"
                      timeout: 5000
