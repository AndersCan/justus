appId: no.cankode.justus
---
# Step 3 of the release walk (e2e/device/release-walk.walk.ts runs it): Ben opens Ada's invite link in
# Chrome and sees the invite page's button. Words come in with -e from the copy catalogue.
- openLink:
    link: ${LINK}
    browser: true
# Chrome offers its notifications promo on the first page it loads. Dismiss it when it shows.
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn:
          text: "No thanks"
          waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: ${OPEN}
    timeout: 60000
- takeScreenshot: ben-3-invite-page
