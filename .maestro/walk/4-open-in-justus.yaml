appId: no.cankode.justus
---
# Step 4 of the release walk: Ben taps Open in Justus, gets through the fresh-install welcome, and
# Justus asks to join Ada's album. Words come in with -e from the copy catalogue.
- tapOn:
    text: ${OPEN}
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: ${SKIP}
    timeout: 90000
- tapOn:
    text: ${SKIP}
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
- tapOn:
    text: ${YOUR_NAME}
    waitToSettleTimeoutMs: 500
# Type only once the field has focus: the tap returns when the screen changes, which can be
# before the field holds focus and the keyboard is up.
- extendedWaitUntil:
    visible:
      text: ${YOUR_NAME}
      focused: true
    timeout: 15000
- inputText: ${NAME}
# Submit with Enter, not "Continue": the keyboard can cover the button.
- pressKey: Enter
- extendedWaitUntil:
    visible: ${ASK_TITLE}
    timeout: 30000
- takeScreenshot: ben-4-asks-to-join
